[project]
name = "flet-play-billing"
version = "0.1.0"
description = "Google Play Billing for the Premium plan (Flutter in_app_purchase)."
requires-python = ">=3.10"
dependencies = ["flet==1.0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"flutter.flet_play_billing" = ["**/*"]
